palettes:
  - name: gfxpalette
    fixed-entries:
      - color: {index: 0x01, r: 140, g: 243, b: 123} # background
      - color: {index: 0x02, r: 74, g: 170, b: 107} # selected outline
      - color: {index: 0x03, r: 41, g: 101, b: 90} # outline
      - color: {index: 0xFF, r: 255, g: 255, b: 255} # text
    images: automatic

converts:
  - name: icons
    palette: gfxpalette
    transparent-index: 7
    style: rlet
    images:
      - gfx/*.png
outputs:
  - type: c
    include-file: gfx.h
    palettes:
      - gfxpalette
    converts:
      - icons