palettes:
  - name: gfxpalette
    fixed-entries:
      - color: {index: 7, r: 255, g: 0, b: 255}
    images: automatic

converts:
  - name: icons
    palette: gfxpalette
    transparent-index: 7
    style: rlet
    images:
      - gfx/*.png
outputs:
  - type: c
    include-file: gfx.h
    palettes:
      - gfxpalette
    converts:
      - icons